env:
  LANG: "en_GB.UTF-8"

# This file is uploaded into the same build as pipeline.yml (via the
# "Trigger a full build" block step), so it can depend on the
# "framework_build" and "cocoa_fixture" steps defined there.
# Do NOT copy those steps into this file - duplicate keys break the upload.

steps:
  ##############################################################################
  #
  # Test fixtures
  #
  ##############################################################################

  # Stays on Xcode 26 in this pipeline. Xcode 27 fixture builds live in the
  # main pipeline (pipeline.yml), so the two never overwrite each other's artifacts.
  - label: "Build XcFramework test fixtures"
    key: "xcframework_cocoa_fixture"
    depends_on: "framework_build"
    timeout_in_minutes: 30
    agents:
      queue: "macos-26"
    env:
      XCODE_VERSION: "26.1.1"
    plugins:
      artifacts#v1.9.4:
        download:
          - "Bugsnag.xcframework.zip"
          - "BugsnagNetworkRequestPlugin.xcframework.zip"
        upload:
          - "features/fixtures/ios/output/iOSTestAppXcFramework.ipa"
          - "features/fixtures/ios/output/xcframework_ipa_url_bb.txt"
          - "features/fixtures/macos/output/macOSTestAppXcFramework.zip"
    commands:
      - "unzip Bugsnag.xcframework.zip"
      - "unzip BugsnagNetworkRequestPlugin.xcframework.zip"
      - "bundle install"
      - "make xcframework-test-fixtures"
      - "bundle exec upload-app --farm=bb --app=./features/fixtures/ios/output/iOSTestAppXcFramework.ipa --app-id-file=./features/fixtures/ios/output/xcframework_ipa_url_bb.txt"

  ##############################################################################
  #
  # e2e tests
  #
  ##############################################################################

  #
  # XcFramework e2e tests
  #
  - label: ":bitbar: {{matrix}} XcFramework barebone e2e tests"
    matrix:
      - "IOS_26"
      - "IOS_13"
    depends_on: "xcframework_cocoa_fixture"
    timeout_in_minutes: 20
    agents:
      queue: "opensource"
    plugins:
      artifacts#v1.9.4:
        download: "features/fixtures/ios/output/xcframework_ipa_url_bb.txt"
        upload:
          - "maze_output/failed/**/*"
          - "maze_output/maze_output.zip"
      docker-compose#v4.7.0:
        pull: "cocoa-maze-runner-bitbar"
        run: "cocoa-maze-runner-bitbar"
        service-ports: true
        command:
          - "--app=@/app/build/xcframework_ipa_url_bb.txt"
          - "--farm=bb"
          - "--device={{matrix}}"
          - "--no-tunnel"
          - "--aws-public-ip"
          - "--repeater-api-key="
          - "--hub-repeater-api-key="
          - "features/release/barebone_tests.feature"
      test-collector#v1.11.0:
        files: "reports/TEST-*.xml"
        format: "junit"
        branch: "^master|next$$"
    concurrency: 25
    concurrency_group: "bitbar"
    concurrency_method: "eager"
    retry:
      automatic:
        - exit_status: -1  # Agent was lost
          limit: 2
        - exit_status: 103  # Appium session failed
          limit: 2

  - label: "macOS {{matrix.os}} XcFramework barebone e2e tests"
    matrix:
      setup:
        os: [ "26", "10.13" ]
    depends_on: "xcframework_cocoa_fixture"
    timeout_in_minutes: 10
    agents:
      queue: "macos-{{matrix.os}}-isolated"
    plugins:
      artifacts#v1.9.4:
        download: "features/fixtures/macos/output/macOSTestAppXcFramework.zip"
        upload:
          - "*.log"
          - "maze_output/failed/**/*"
          - "maze_output/maze_output.zip"
      test-collector#v1.11.0:
        files: "reports/TEST-*.xml"
        format: "junit"
        branch: "^master|next$$"
    env:
      RUN_XCFRAMEWORK_APP: "true"
    commands:
      - "bundle install"
      - "bundle exec maze-runner features/release/barebone_tests.feature --os=macos --repeater-api-key= --hub-repeater-api-key="

  #
  # BitBar
  #
  - label: ":bitbar: {{matrix}} e2e tests batch 1"
    matrix:
      - "IOS_26"
      - "IOS_18"
      - "IOS_17"
      - "IOS_16"
      - "IOS_15"
      - "IOS_14"
      - "IOS_13"
    depends_on: "cocoa_fixture"
    timeout_in_minutes: 60
    agents:
      queue: "opensource"
    plugins:
      artifacts#v1.9.4:
        download: "features/fixtures/ios/output/ipa_url_bb_release.txt"
        upload:
          - "maze_output/failed/**/*"
          - "maze_output/maze_output.zip"
      docker-compose#v4.7.0:
        pull: "cocoa-maze-runner-bitbar"
        run: "cocoa-maze-runner-bitbar"
        service-ports: true
        command:
          - "--app=@/app/build/ipa_url_bb_release.txt"
          - "--farm=bb"
          - "--device={{matrix}}"
          - "--no-tunnel"
          - "--aws-public-ip"
          - "--fail-fast"
          - "features/release"
          - "--exclude=features/release/[e-z].*.feature$"
      test-collector#v1.11.0:
        files: "reports/TEST-*.xml"
        format: "junit"
        branch: "^master|next$$"
    concurrency: 25
    concurrency_group: "bitbar"
    concurrency_method: "eager"
    retry:
      automatic:
        - exit_status: -1  # Agent was lost
          limit: 2
        - exit_status: 103  # Appium session failed
          limit: 2

  - label: ":bitbar: {{matrix}} e2e tests batch 2"
    matrix:
      - "IOS_26"
      - "IOS_18"
      - "IOS_17"
      - "IOS_16"
      - "IOS_15"
      - "IOS_14"
      - "IOS_13"
    depends_on: "cocoa_fixture"
    timeout_in_minutes: 60
    agents:
      queue: "opensource"
    plugins:
      artifacts#v1.9.4:
        download: "features/fixtures/ios/output/ipa_url_bb_release.txt"
        upload:
          - "maze_output/failed/**/*"
          - "maze_output/maze_output.zip"
      docker-compose#v4.7.0:
        pull: "cocoa-maze-runner-bitbar"
        run: "cocoa-maze-runner-bitbar"
        service-ports: true
        command:
          - "--app=@/app/build/ipa_url_bb_release.txt"
          - "--farm=bb"
          - "--device={{matrix}}"
          - "--no-tunnel"
          - "--aws-public-ip"
          - "--fail-fast"
          - "features/release"
          - "--exclude=features/release/[a-d].*.feature$"
      test-collector#v1.11.0:
        files: "reports/TEST-*.xml"
        format: "junit"
        branch: "^master|next$$"
    concurrency: 25
    concurrency_group: "bitbar"
    concurrency_method: "eager"
    retry:
      automatic:
        - exit_status: -1  # Agent was lost
          limit: 2
        - exit_status: 103  # Appium session failed
          limit: 2

  #
  # BrowserStack
  #
  # PLAT-11155: App hang tests run on BrowserStack (Appium 1.x) for now
  - label: ":browserstack: {{matrix}} app hang tests"
    matrix:
      - "IOS_26"
      - "IOS_18"
      - "IOS_17"
      - "IOS_16"
      - "IOS_15"
      - "IOS_14"
      # PLAT-12554: Currently being skipped due to issues with app-hang test on iOS 13
      # - "IOS_13"
    depends_on: "cocoa_fixture"
    timeout_in_minutes: 30
    agents:
      queue: "opensource"
    plugins:
      artifacts#v1.9.4:
        download: "features/fixtures/ios/output/ipa_url_bs_release.txt"
        upload:
          - "maze_output/failed/**/*"
          - "maze_output/maze_output.zip"
      docker-compose#v5.8.0:
        pull: "cocoa-maze-runner"
        run: "cocoa-maze-runner"
        command:
          - "--app=@build/ipa_url_bs_release.txt"
          - "--farm=bs"
          - "--device={{matrix}}"
          - "--appium-version=1.21.0"
          - "--fail-fast"
          - "features/app_hangs.feature"
      test-collector#v1.11.0:
        files: "reports/TEST-*.xml"
        format: "junit"
        branch: "^master|next$$"
    concurrency: 5
    concurrency_group: "browserstack-app"
    concurrency_method: "eager"
    retry:
      automatic:
        - exit_status: -1  # Agent was lost
          limit: 2
        - exit_status: 104 # App hang related error
          limit: 2
        - exit_status: 103  # Appium session failed
          limit: 2

  #
  # macOS e2e tests
  #
  - label: "macOS {{matrix.os}} e2e tests"
    matrix:
      setup:
        os: [ "26", "15", "14", "13", "12", "11", "10.15", "10.14", "10.13" ]
    depends_on: "cocoa_fixture"
    timeout_in_minutes: 60
    agents:
      queue: "macos-{{matrix.os}}-isolated"
    plugins:
      artifacts#v1.9.4:
        download: "features/fixtures/macos/output/macOSTestApp_Release.zip"
        upload:
          - "macOSTestApp.stderr.log"
          - "maze_output/failed/**/*"
          - "maze_output/maze_output.zip"
      test-collector#v1.11.0:
        files: "reports/TEST-*.xml"
        format: "junit"
        branch: "^master|next$$"
    commands:
      - "bundle install"
      - "bundle exec maze-runner features/release --os=macos --fail-fast"

  ##############################################################################
  #
  # Build example apps - on BOTH Xcode 26 and Xcode 27
  #
  # Each step is a matrix of (queue, xcode). Mismatched combinations are
  # skipped, so every example app builds exactly twice:
  #   - macos-26          + Xcode 26.1.1   (must pass, as before)
  #   - developer-machine + Xcode 27.0.0   (soft_fail, like pipeline.yml)
  #
  # The Xcode 27 jobs run on the "developer-machine" queue (infra team) and
  # first check that they landed on the macos-26-2 host with Xcode 27 as the
  # active Xcode. If they didn't, they fail straight away with a clear error.
  # "27.0.0" matches the installed app (/Applications/Xcode-27.0.0.app).
  #
  # PLAT-17374: CI-only overrides for the Xcode 27 jobs ONLY. A temporary
  # xcconfig is written to /tmp and exported as XCODE_XCCONFIG_FILE, which
  # xcodebuild applies to every target (including Pods):
  #   - IPHONEOS_DEPLOYMENT_TARGET = 15.0  (Xcode 27 supports 15.0+; SDK uses 12.0)
  #   - TVOS_DEPLOYMENT_TARGET     = 15.0
  #   - MACOSX_DEPLOYMENT_TARGET   = 12.0  (Xcode 27 supports 12.0+; SDK uses 10.11)
  #   - OTHER_CFLAGS += -Wno-error=deprecated-declarations
  #       (APIs deprecated before iOS 15 become warnings, not -Werror failures)
  # Nothing is added to the repo, and the Xcode 26 jobs build exactly as before.
  # All commands in a step run in one shell, so the export applies to
  # pod install / xcodebuild later in the step.
  #
  ##############################################################################

  - group: "Build Example Apps"
    steps:
      - label: "examples/objective-c-ios (Xcode {{matrix.xcode}})"
        timeout_in_minutes: 10
        matrix:
          setup:
            queue: [ "macos-26", "developer-machine" ]
            xcode: [ "26.1.1", "27.0.0" ]
          adjustments:
            - with: { queue: "macos-26", xcode: "27.0.0" }
              skip: true
            - with: { queue: "developer-machine", xcode: "26.1.1" }
              skip: true
            - with: { queue: "developer-machine", xcode: "27.0.0" }
              soft_fail: true
        agents:
          queue: "{{matrix.queue}}"
        env:
          XCODE_VERSION: "{{matrix.xcode}}"
        commands:
          - |
            if [ "{{matrix.queue}}" = "developer-machine" ]; then
              hostname -s | grep -q '^macos-26-2' || { echo "ERROR: expected macos-26-2, got $$(hostname -s)"; exit 1; }
              xcodebuild -version | grep -q '^Xcode 27' || { echo "ERROR: active Xcode is not Xcode 27"; xcodebuild -version; exit 1; }
              export XCODE_XCCONFIG_FILE="/tmp/xcode27-overrides-$$BUILDKITE_JOB_ID.xcconfig"
              printf 'IPHONEOS_DEPLOYMENT_TARGET = 15.0\nTVOS_DEPLOYMENT_TARGET = 15.0\nMACOSX_DEPLOYMENT_TARGET = 12.0\nOTHER_CFLAGS = $$(inherited) -Wno-error=deprecated-declarations\n' > "$$XCODE_XCCONFIG_FILE"
              echo "Using CI-only Xcode 27 overrides from $$XCODE_XCCONFIG_FILE:" && cat "$$XCODE_XCCONFIG_FILE"
            fi
          - bundle install
          - cd examples/objective-c-ios
          - echo "--- Pod install"
          - pod install
          - echo "+++ Build Release iOS"
          - xcodebuild -allowProvisioningUpdates -workspace objective-c-ios.xcworkspace -scheme objective-c-ios -configuration Release -destination generic/platform=iOS -derivedDataPath DerivedData -quiet build GCC_TREAT_WARNINGS_AS_ERRORS=YES
          - echo "+++ Build Debug iOS Simulator"
          - xcodebuild -allowProvisioningUpdates -workspace objective-c-ios.xcworkspace -scheme objective-c-ios -configuration Debug -destination generic/platform=iOS\ Simulator -derivedDataPath DerivedData -quiet build GCC_TREAT_WARNINGS_AS_ERRORS=YES
          - echo "+++ Build Debug Mac Catalyst"
          - xcodebuild -allowProvisioningUpdates -workspace objective-c-ios.xcworkspace -scheme objective-c-ios -configuration Debug -destination generic/platform=macOS -derivedDataPath DerivedData -quiet build

      - label: "examples/objective-c-osx (Xcode {{matrix.xcode}})"
        timeout_in_minutes: 10
        matrix:
          setup:
            queue: [ "macos-26", "developer-machine" ]
            xcode: [ "26.1.1", "27.0.0" ]
          adjustments:
            - with: { queue: "macos-26", xcode: "27.0.0" }
              skip: true
            - with: { queue: "developer-machine", xcode: "26.1.1" }
              skip: true
            - with: { queue: "developer-machine", xcode: "27.0.0" }
              soft_fail: true
        agents:
          queue: "{{matrix.queue}}"
        env:
          XCODE_VERSION: "{{matrix.xcode}}"
        commands:
          - |
            if [ "{{matrix.queue}}" = "developer-machine" ]; then
              hostname -s | grep -q '^macos-26-2' || { echo "ERROR: expected macos-26-2, got $$(hostname -s)"; exit 1; }
              xcodebuild -version | grep -q '^Xcode 27' || { echo "ERROR: active Xcode is not Xcode 27"; xcodebuild -version; exit 1; }
              export XCODE_XCCONFIG_FILE="/tmp/xcode27-overrides-$$BUILDKITE_JOB_ID.xcconfig"
              printf 'IPHONEOS_DEPLOYMENT_TARGET = 15.0\nTVOS_DEPLOYMENT_TARGET = 15.0\nMACOSX_DEPLOYMENT_TARGET = 12.0\nOTHER_CFLAGS = $$(inherited) -Wno-error=deprecated-declarations\n' > "$$XCODE_XCCONFIG_FILE"
              echo "Using CI-only Xcode 27 overrides from $$XCODE_XCCONFIG_FILE:" && cat "$$XCODE_XCCONFIG_FILE"
            fi
          - bundle install
          - cd examples/objective-c-osx
          - echo "--- Pod install"
          - pod install
          - echo "+++ Build Release macOS"
          - xcodebuild -allowProvisioningUpdates -workspace objective-c-osx.xcworkspace -scheme objective-c-osx -configuration Release -derivedDataPath DerivedData -quiet build GCC_TREAT_WARNINGS_AS_ERRORS=YES
          - echo "+++ Build Debug macOS"
          - xcodebuild -allowProvisioningUpdates -workspace objective-c-osx.xcworkspace -scheme objective-c-osx -configuration Debug -derivedDataPath DerivedData -quiet build GCC_TREAT_WARNINGS_AS_ERRORS=YES

      - label: "examples/swift-ios (Xcode {{matrix.xcode}})"
        timeout_in_minutes: 10
        matrix:
          setup:
            queue: [ "macos-26", "developer-machine" ]
            xcode: [ "26.1.1", "27.0.0" ]
          adjustments:
            - with: { queue: "macos-26", xcode: "27.0.0" }
              skip: true
            - with: { queue: "developer-machine", xcode: "26.1.1" }
              skip: true
            - with: { queue: "developer-machine", xcode: "27.0.0" }
              soft_fail: true
        agents:
          queue: "{{matrix.queue}}"
        env:
          XCODE_VERSION: "{{matrix.xcode}}"
        commands:
          - |
            if [ "{{matrix.queue}}" = "developer-machine" ]; then
              hostname -s | grep -q '^macos-26-2' || { echo "ERROR: expected macos-26-2, got $$(hostname -s)"; exit 1; }
              xcodebuild -version | grep -q '^Xcode 27' || { echo "ERROR: active Xcode is not Xcode 27"; xcodebuild -version; exit 1; }
              export XCODE_XCCONFIG_FILE="/tmp/xcode27-overrides-$$BUILDKITE_JOB_ID.xcconfig"
              printf 'IPHONEOS_DEPLOYMENT_TARGET = 15.0\nTVOS_DEPLOYMENT_TARGET = 15.0\nMACOSX_DEPLOYMENT_TARGET = 12.0\nOTHER_CFLAGS = $$(inherited) -Wno-error=deprecated-declarations\n' > "$$XCODE_XCCONFIG_FILE"
              echo "Using CI-only Xcode 27 overrides from $$XCODE_XCCONFIG_FILE:" && cat "$$XCODE_XCCONFIG_FILE"
            fi
          - bundle install
          - cd examples/swift-ios
          - echo "--- Pod install"
          - pod install
          - echo "+++ Build Release iOS"
          - xcodebuild -allowProvisioningUpdates -workspace swift-ios.xcworkspace -scheme swift-ios -configuration Release -destination generic/platform=iOS -derivedDataPath DerivedData -quiet build GCC_TREAT_WARNINGS_AS_ERRORS=YES
          - echo "+++ Build Debug iOS Simulator"
          - xcodebuild -allowProvisioningUpdates -workspace swift-ios.xcworkspace -scheme swift-ios -configuration Debug -destination generic/platform=iOS\ Simulator -derivedDataPath DerivedData -quiet build GCC_TREAT_WARNINGS_AS_ERRORS=YES

      - label: "examples/swift-package-manager (Xcode {{matrix.xcode}})"
        timeout_in_minutes: 10
        matrix:
          setup:
            queue: [ "macos-26", "developer-machine" ]
            xcode: [ "26.1.1", "27.0.0" ]
          adjustments:
            - with: { queue: "macos-26", xcode: "27.0.0" }
              skip: true
            - with: { queue: "developer-machine", xcode: "26.1.1" }
              skip: true
            - with: { queue: "developer-machine", xcode: "27.0.0" }
              soft_fail: true
        agents:
          queue: "{{matrix.queue}}"
        env:
          XCODE_VERSION: "{{matrix.xcode}}"
        commands:
          - |
            if [ "{{matrix.queue}}" = "developer-machine" ]; then
              hostname -s | grep -q '^macos-26-2' || { echo "ERROR: expected macos-26-2, got $$(hostname -s)"; exit 1; }
              xcodebuild -version | grep -q '^Xcode 27' || { echo "ERROR: active Xcode is not Xcode 27"; xcodebuild -version; exit 1; }
              export XCODE_XCCONFIG_FILE="/tmp/xcode27-overrides-$$BUILDKITE_JOB_ID.xcconfig"
              printf 'IPHONEOS_DEPLOYMENT_TARGET = 15.0\nTVOS_DEPLOYMENT_TARGET = 15.0\nMACOSX_DEPLOYMENT_TARGET = 12.0\nOTHER_CFLAGS = $$(inherited) -Wno-error=deprecated-declarations\n' > "$$XCODE_XCCONFIG_FILE"
              echo "Using CI-only Xcode 27 overrides from $$XCODE_XCCONFIG_FILE:" && cat "$$XCODE_XCCONFIG_FILE"
            fi
          - bundle install
          - cd examples/swift-package-manager
          - echo "--- Resolve Swift Package Dependencies"
          - sed -i '' -e 's/kind = branch/kind = revision/' -e "s/branch = master/revision = ${BUILDKITE_COMMIT}/" swift-package-manager.xcodeproj/project.pbxproj
          - xcodebuild -allowProvisioningUpdates -scheme swift-package-manager -derivedDataPath DerivedData -resolvePackageDependencies
          - echo "+++ Build Release iOS"
          - xcodebuild -allowProvisioningUpdates -scheme swift-package-manager -configuration Release -destination generic/platform=iOS -derivedDataPath DerivedData -quiet build GCC_TREAT_WARNINGS_AS_ERRORS=YES
          - echo "+++ Build Debug iOS Simulator"
          - xcodebuild -allowProvisioningUpdates -scheme swift-package-manager -configuration Debug -destination generic/platform=iOS\ Simulator -derivedDataPath DerivedData -quiet build GCC_TREAT_WARNINGS_AS_ERRORS=YES

      - label: "examples/swiftui (Xcode {{matrix.xcode}})"
        timeout_in_minutes: 10
        matrix:
          setup:
            queue: [ "macos-26", "developer-machine" ]
            xcode: [ "26.1.1", "27.0.0" ]
          adjustments:
            - with: { queue: "macos-26", xcode: "27.0.0" }
              skip: true
            - with: { queue: "developer-machine", xcode: "26.1.1" }
              skip: true
            - with: { queue: "developer-machine", xcode: "27.0.0" }
              soft_fail: true
        agents:
          queue: "{{matrix.queue}}"
        env:
          XCODE_VERSION: "{{matrix.xcode}}"
        commands:
          - |
            if [ "{{matrix.queue}}" = "developer-machine" ]; then
              hostname -s | grep -q '^macos-26-2' || { echo "ERROR: expected macos-26-2, got $$(hostname -s)"; exit 1; }
              xcodebuild -version | grep -q '^Xcode 27' || { echo "ERROR: active Xcode is not Xcode 27"; xcodebuild -version; exit 1; }
              export XCODE_XCCONFIG_FILE="/tmp/xcode27-overrides-$$BUILDKITE_JOB_ID.xcconfig"
              printf 'IPHONEOS_DEPLOYMENT_TARGET = 15.0\nTVOS_DEPLOYMENT_TARGET = 15.0\nMACOSX_DEPLOYMENT_TARGET = 12.0\nOTHER_CFLAGS = $$(inherited) -Wno-error=deprecated-declarations\n' > "$$XCODE_XCCONFIG_FILE"
              echo "Using CI-only Xcode 27 overrides from $$XCODE_XCCONFIG_FILE:" && cat "$$XCODE_XCCONFIG_FILE"
            fi
          - bundle install
          - cd examples/swiftui
          - echo "--- Resolve Swift Package Dependencies"
          - sed -i '' -e 's/kind = branch/kind = revision/' -e "s/branch = master/revision = ${BUILDKITE_COMMIT}/" swiftui.xcodeproj/project.pbxproj
          - xcodebuild -allowProvisioningUpdates -scheme "swiftui (iOS)" -derivedDataPath DerivedData -resolvePackageDependencies
          - echo "+++ Build Release iOS"
          - xcodebuild -allowProvisioningUpdates -scheme "swiftui (iOS)" -configuration Release -destination generic/platform=iOS -derivedDataPath DerivedData -quiet build GCC_TREAT_WARNINGS_AS_ERRORS=YES
          - echo "+++ Build Debug iOS Simulator"
          - xcodebuild -allowProvisioningUpdates -scheme "swiftui (iOS)" -configuration Debug -destination generic/platform=iOS\ Simulator -derivedDataPath DerivedData -quiet build GCC_TREAT_WARNINGS_AS_ERRORS=YES
          - echo "+++ Build Release macOS"
          - xcodebuild -allowProvisioningUpdates -scheme "swiftui (macOS)" -configuration Release -derivedDataPath DerivedData -quiet build GCC_TREAT_WARNINGS_AS_ERRORS=YES
          - echo "+++ Build Release tvOS"
          - xcodebuild -allowProvisioningUpdates -scheme "swiftui (tvOS)" -configuration Release -destination generic/platform=tvOS -derivedDataPath DerivedData -quiet build GCC_TREAT_WARNINGS_AS_ERRORS=YES
          - echo "+++ Build Debug tvOS Simulator"
          - xcodebuild -allowProvisioningUpdates -scheme "swiftui (tvOS)" -configuration Debug -destination generic/platform=tvOS\ Simulator -derivedDataPath DerivedData -quiet build GCC_TREAT_WARNINGS_AS_ERRORS=YES
